services:
  postgres:
    image: postgres:16-alpine
    container_name: scenarai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenarai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: scenarai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [scenarai_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenarai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scenarai_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    networks: [scenarai_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenarai_migrate
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python seed_demo.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenarai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scenarai
    depends_on:
      postgres:
        condition: service_healthy
    networks: [scenarai_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenarai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenarai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scenarai
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [scenarai_net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenarai_worker
    restart: unless-stopped
    command: ["arq", "worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenarai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/scenarai
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
      MEDIA_ENABLED: ${MEDIA_ENABLED:-false}
      IMAGE_BRIDGE_URL: ${IMAGE_BRIDGE_URL:-http://host.docker.internal:8188}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks: [scenarai_net]

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
      args:
        VITE_DISABLE_SSE: ${VITE_DISABLE_SSE:-true}
        VITE_MEDIA_ENABLED: ${VITE_MEDIA_ENABLED:-false}
    container_name: scenarai_frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [scenarai_net]

  nginx:
    image: nginx:alpine
    container_name: scenarai_nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend, frontend]
    networks: [scenarai_net]

volumes:
  postgres_data:
  redis_data:

networks:
  scenarai_net:
    driver: bridge
