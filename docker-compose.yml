services:

  postgres:
    image: postgres:16-alpine
    container_name: scenarai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scenarai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: scenarai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - scenarai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenarai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scenarai_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - scenarai_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenarai_migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenarai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/scenarai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scenarai_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenarai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenarai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/scenarai
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:80}
    volumes:
      # Read+write: /sessions/{id}/export reads existing per-turn segments
      # and writes the concatenated result here (ffmpeg runs in this
      # container — see Dockerfile). Same host path the worker writes into.
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "9000:8000"
    networks:
      - scenarai_net
    healthcheck:
      # No curl in python:3.12-slim — check via the stdlib instead of adding a package.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenarai_worker
    restart: unless-stopped
    command: ["arq", "worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scenarai}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/scenarai
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Native-process image bridge (imagepipe/bridge_server.py) — runs
      # outside Docker to keep direct GPU access. host.docker.internal
      # doesn't auto-resolve on this project's custom bridge network
      # (scenarai_net) without the extra_hosts entry below — verified
      # live, not assumed.
      IMAGE_BRIDGE_URL: ${IMAGE_BRIDGE_URL:-http://host.docker.internal:8188}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Local-disk media storage until R2 exists (see storage.py) --
      # worker writes generated images/audio/video here, nginx serves them
      # read-only below. Bind mount, not a named volume: needs to be a
      # real host path both containers can share directly.
      - ./media:/app/media
    depends_on:
      # Waiting on backend (not just migrate) closes the original migration
      # race and also means nothing enqueues a job until the API is actually
      # up and able to receive requests.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - scenarai_net

  frontend:
    build:
      context: ./frontend/app
      dockerfile: Dockerfile
    container_name: scenarai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - scenarai_net

  nginx:
    image: nginx:alpine
    container_name: scenarai_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/usr/share/nginx/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - scenarai_net

volumes:
  postgres_data:
  redis_data:

networks:
  scenarai_net:
    driver: bridge
