events {}

http {
    # Minimal hand-written config, not the stock nginx default.conf --
    # mime.types isn't pulled in automatically here. Without this,
    # /media/*.png etc. serve as text/plain and browsers won't render
    # them as images (caught live, not assumed).
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        listen [::]:80;

        server_name localhost;

        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Vite's dev server (npm run dev, see frontend/app/Dockerfile)
            # uses a WebSocket for HMR (hot module reload). Without an
            # Upgrade header, nginx proxies it as a plain HTTP request and
            # the WebSocket handshake silently fails -- HMR just doesn't
            # work when accessed through nginx (port 80) rather than
            # hitting Vite directly at :3000. The app itself still works
            # either way, just without live-reload on this path.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Locally-generated per-turn media (image/audio/video) -- local
        # disk until R2 exists, see storage.py and docker-compose.yml's
        # worker volume mount.
        location /media/ {
            alias /usr/share/nginx/media/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /api/ {
            # Trailing slash on both the location and proxy_pass target is
            # load-bearing: it strips the /api prefix before forwarding, so
            # /api/health reaches the backend as /health. Found live --
            # without it every request 404s (backend has no /api/* routes;
            # frontend/api.js calls a bare '/api' base, mirroring the Vite
            # dev proxy's explicit `path.replace(/^\/api/, '')`).
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE / streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }
    }
}
