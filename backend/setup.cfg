[flake8]
max-line-length = 120
# Deliberate, consistent style choices in this codebase (see
# INSPECTION_REPORT.md's L-7), not oversights -- ignoring them here stops
# flake8 flagging ~250 non-issues so it can actually surface real ones.
#   E221/E241 - column-alignment on '=' and ',' (e.g. schemas.py's field lists)
#   E701/E702 - semicolon-packed one-liners (e.g. "id: str; email: str")
#   E402      - imports after logging.basicConfig() at the top of main.py/worker.py
#   E302      - single blank line between compact one-line class defs
#   E127/E124 - hanging-indent continuation lines that don't match pycodestyle's
#               preferred visual indent (a real but purely cosmetic mismatch)
#   E226      - missing whitespace around arithmetic operators
#   W503/W504 - line break before/after binary operator (mutually exclusive
#               by design; PEP8 itself doesn't enforce either)
ignore = E221,E241,E701,E702,E402,E302,E127,E124,E226,W503,W504
exclude = alembic
per-file-ignores =
    engine/__init__.py: F401
