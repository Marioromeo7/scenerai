name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

      - name: Lint (non-blocking style issues already ignored via setup.cfg)
        run: flake8 .
        # The step name has always said "non-blocking", but nothing here
        # actually enforced that -- flake8 exits non-zero on any finding
        # (even the ~54 genuine-but-minor ones left deliberately visible,
        # not fixed, after the setup.cfg cleanup), which failed the whole
        # run despite tests passing. This makes the step match what it
        # already claimed to be: visible in the log, never blocking.
        continue-on-error: true
